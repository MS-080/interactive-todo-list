<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>📝 My To-Do List</h1>
        <p>Stay organized and get things done!</p>
    </div>


    <!-- Main To-Do Container -->
    <div class="todo-container">

        <!-- Input and Add Button -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addButton">
                Add Task
            </button>

        </div>


        <!-- Error Message -->
        <p id="message"></p>


        <!-- Task Counter -->
        <p id="taskCounter">
            0 task(s)
        </p>


        <!-- Task List -->
        <ul id="taskList"></ul>

    </div>


    <!-- Footer -->
    <footer>
        <p>Simple To-Do List • Web Development Assignment</p>
    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
